[project]
name = "collabstr-challenge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1",
    "django>=5.2,<6",
    "gunicorn>=27.0.1",
    "pydantic>=2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"briefs/tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
ignore_missing_imports = true
exclude = ["briefs/tests/"]

[[tool.mypy.overrides]]
module = "briefs.tests.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]
